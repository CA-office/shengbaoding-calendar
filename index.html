<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勝寶鼎/新弘股公司｜行事曆</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} :root{--bd:#d7e0e8;--tx:#18324d;--muted:#66788a;--green:#20a95b}
body{margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;background:#fff;color:var(--tx)} button,input,textarea,select{font:inherit}.hidden{display:none!important}
.loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#f3f7fa}.loginCard{width:min(430px,100%);background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:0 14px 40px #17324d15}.loginCard h1{font-size:24px;margin:0 0 6px;text-align:center}.loginSub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}.field{display:block;font-weight:800;font-size:13px;margin:10px 0}.field input{width:100%;padding:12px;border:1px solid #bcc9d4;border-radius:9px;margin-top:5px}.loginBtn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--green);color:#fff;font-weight:900;margin-top:8px}.err{color:#c51d1d;font-size:13px;margin-top:10px;min-height:20px;text-align:center}
header{padding:8px 7px 7px;border-bottom:1px solid var(--bd);background:#fff;position:sticky;top:0;z-index:20}.toprow{display:flex;align-items:center;justify-content:center;gap:8px}.brand{font-weight:900;font-size:19px;text-align:center;flex:1}.userBtn{white-space:nowrap;padding:5px 8px;border:1px solid #c8d2dc;border-radius:8px;background:#fff;font-size:11px}.roleLine{text-align:center;font-size:10px;color:var(--muted);margin-top:2px}.controls{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}.controls button{padding:6px 8px;border:1px solid #c9d3dc;border-radius:8px;background:#fff}.month{font-size:17px;font-weight:900;min-width:112px;text-align:center}.legend{display:flex;justify-content:center;gap:5px 9px;flex-wrap:wrap;margin-top:6px;font-size:9px}.lg{display:flex;gap:3px;align-items:center}.dot{width:8px;height:8px;border-radius:50%}
main{padding:4px}.calendar{border:1px solid #cbd5de;border-radius:6px;overflow:hidden;background:#fff}.weekhead,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekhead div{text-align:center;font-size:10px;font-weight:800;padding:5px 1px;background:#f7fafc;border-right:1px solid #d8e0e7}.weekhead div:last-child{border-right:0}.day{min-height:88px;border-top:1px solid #d8e0e7;border-right:1px solid #d8e0e7;padding:2px;overflow:hidden;background:#fff}.day:nth-child(7){border-right:0}.blank{background:#fbfcfd}.date{font-size:11px;font-weight:900;line-height:1.1}.holiday .date,.holidayName,.weekend{color:#df1717}.holidayName{display:block;font-size:7px;line-height:1;font-weight:800;margin-top:1px}.split{border-top:1px dashed #8898a7;margin:3px 0}.event{font-size:7.5px;line-height:1.15;border-radius:3px;padding:2px;margin:2px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.adminEvent{cursor:pointer}.blue{color:#07579d;border:1px solid #b9dcfa;background:#f4faff}.green{color:#166033;border:1px solid #bde4c5;background:#f6fcf6}.red{color:#a21414;border:1px solid #f2c2c2;background:#fffafa}.orange{color:#984a00;border:1px solid #f1d1b0;background:#fffaf5}.purple{color:#633399;border:1px solid #d9c4ef;background:#fcf9ff}.yellow{color:#715900;border:1px solid #e7d992;background:#fffdf4}.black{color:#111;border:1px solid #cdd2d6;background:#fafafa}.actions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:7px}.btn{border:1px solid #cbd5de;border-radius:8px;padding:10px;background:#fff;font-weight:800}.primary{background:var(--green);color:#fff;border-color:var(--green)}.noteBox{display:none;margin-top:7px;border:1px solid #d1dae2;border-radius:8px;padding:9px;background:#fff}.noteBox.show{display:block}.noteTitle{font-weight:900;margin-bottom:5px}.noteText{font-size:13px;line-height:1.55;white-space:pre-wrap}.sync{text-align:center;font-size:10px;color:var(--muted);padding:7px 0 2px}
dialog{border:0;border-radius:14px;padding:0;width:min(470px,94vw);box-shadow:0 18px 55px #0005}dialog::backdrop{background:#0006}.form{padding:17px;display:grid;gap:9px}.form h2{margin:0}.form input,.form textarea,.form select{width:100%;padding:10px;border:1px solid #bdc8d2;border-radius:7px;margin-top:4px}.form textarea{height:110px}.formActions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.formActions button{padding:8px 12px;border:1px solid #cbd5de;border-radius:8px;background:#fff}.formActions .primary{background:var(--green);color:#fff}.danger{background:#d62d2d!important;color:#fff!important;border-color:#d62d2d!important}
@media(min-width:701px){body{background:#f4f7fa}.brand{font-size:25px}.calendar{max-width:1500px;margin:auto}.day{min-height:145px}.date{font-size:18px}.holidayName{display:inline;font-size:11px;margin-left:4px}.event{font-size:12px;padding:5px}.actions,.noteBox{max-width:760px;margin-left:auto;margin-right:auto}.legend{font-size:13px}.dot{width:12px;height:12px}}
</style>
</head>
<body>
<div id="pullRefresh" class="pullRefresh">下拉重新整理</div>
<section id="loginPage" class="loginWrap"><div class="loginCard"><h1>勝寶鼎/新弘股公司</h1><label class="field">Email<input id="loginEmail" type="email" autocomplete="username"></label><label class="field">密碼<input id="loginPassword" type="password" autocomplete="current-password"></label><button id="loginBtn" class="loginBtn">登入</button><div id="loginErr" class="err"></div></div></section>
<section id="appPage" class="hidden"><header><div class="toprow"><div class="brand">勝寶鼎/新弘股公司｜行事曆</div><button id="logoutBtn" class="userBtn">登出</button></div><div id="roleLine" class="roleLine"></div><div class="controls"><button id="prevBtn">‹</button><div id="monthTitle" class="month"></div><button id="nextBtn">›</button><button id="todayBtn">本月</button><button id="noteBtn" class="hidden">備註</button></div><div class="legend"><span class="lg"><i class="dot" style="background:#20aa5a"></i>綠－石英石</span><span class="lg"><i class="dot" style="background:#2196f3"></i>藍－人造石</span><span class="lg"><i class="dot" style="background:#e52424"></i>紅</span><span class="lg"><i class="dot" style="background:#ff851b"></i>橘</span><span class="lg"><i class="dot" style="background:#8c35d5"></i>紫</span><span class="lg"><i class="dot" style="background:#e5b800"></i>黃</span><span class="lg"><i class="dot" style="background:#111"></i>黑</span></div></header><main><section class="calendar"><div class="weekhead"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="weekend">六</div><div class="weekend">日</div></div><div id="weeks"></div></section><div class="actions"><button id="addBtn" class="btn primary hidden">＋ 新增行程</button></div><div id="noteBox" class="noteBox"><div class="noteTitle">備註</div><div id="noteText" class="noteText"></div></div><div id="syncText" class="sync"></div></main></section>
<dialog id="viewDlg">
  <div class="form">
    <h2>查看行程</h2>
    <div><b>日期</b><div id="vdate"></div></div>
    <div><b>案名</b><div id="vtitle"></div></div>
    <div><b>內容</b><div id="vdetail" style="white-space:pre-wrap"></div></div>
    <div class="formActions"><button type="button" id="closeViewBtn">關閉</button></div>
  </div>
</dialog>
<dialog id="eventDlg"><form class="form" method="dialog"><h2 id="eventDlgTitle">新增行程</h2><label>日期<input id="fdate" type="text" inputmode="numeric" placeholder="例如：20260901 或 2026/09/01"></label><label>時間<input id="ftime" type="text" inputmode="numeric" placeholder="例如：0830 或 08:30"></label><label>案名<input id="ftitle" placeholder="例如：工地會勘"></label><label>顏色<select id="fcolor"><option value="blue">藍色－人造石</option><option value="green">綠色－石英石</option><option value="red">紅色</option><option value="orange">橘色</option><option value="purple">紫色</option><option value="yellow">黃色</option><option value="black">黑色</option></select></label><label>詳細內容<textarea id="fdetail" placeholder="地點、人員、工作內容、備註……"></textarea></label><div class="formActions"><button id="deleteEventBtn" type="button" class="danger hidden">刪除</button><button value="cancel">取消</button><button id="saveEventBtn" type="button" class="primary">儲存</button></div></form></dialog>
<dialog id="noteDlg"><form class="form" method="dialog"><h2>備註</h2><label>內容<textarea id="fnote" placeholder="輸入這個月份的備註……"></textarea></label><div class="formActions"><button value="cancel">取消</button><button id="saveNoteBtn" type="button" class="primary">儲存</button></div></form></dialog>
<script>
const SUPABASE_URL="https://zyusqrmayrucesijpmls.supabase.co";
const SUPABASE_KEY="sb_publishable_9EDbdx3Xmm87kqpI8lyPIA_1QDwzZdk";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id); let view=new Date();view.setDate(1);let currentUser=null,profile=null,events=[],currentEditId=null,currentNoteRow=null;
const pad=n=>String(n).padStart(2,"0"),ym=()=>`${view.getFullYear()}-${pad(view.getMonth()+1)}`,firstDay=()=>`${ym()}-01`;
function nextMonthFirst(){const d=new Date(view.getFullYear(),view.getMonth()+1,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`}
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function holidayMap(y,m){const h={};if(y===2026&&m===9){h[25]="中秋節";h[26]="連假";h[27]="連假";h[28]="教師節"}return h}
async function signIn(){ $("loginErr").textContent="";const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||!password){$("loginErr").textContent="請輸入 Email 和密碼";return}$("loginBtn").disabled=true;const {error}=await sb.auth.signInWithPassword({email,password});$("loginBtn").disabled=false;if(error){$("loginErr").textContent="登入失敗，請確認帳號或密碼";return}await boot() }
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$("loginPage").classList.remove("hidden");$("appPage").classList.add("hidden");return}currentUser=session.user;const {data,error}=await sb.from("sbd_users").select("display_name,role,active").eq("user_id",currentUser.id).maybeSingle();if(error||!data||!data.active){await sb.auth.signOut();$("loginErr").textContent="此帳號尚未開通勝寶鼎/新弘股公司權限";$("loginPage").classList.remove("hidden");$("appPage").classList.add("hidden");return}profile=data;$("loginPage").classList.add("hidden");$("appPage").classList.remove("hidden");const roleText=profile.role==="admin"?"管理者":profile.role==="editor"?"可查看＋新增":"只能查看";$("roleLine").textContent=`${profile.display_name||currentUser.email}｜${roleText}`;$("addBtn").classList.toggle("hidden",!["admin","editor"].includes(profile.role));$("noteBtn").classList.toggle("hidden",profile.role!=="admin");await loadMonth()}
async function loadMonth(){ $("syncText").textContent="讀取中…";const {data:e,error:ee}=await sb.from("sbd_calendar_events").select("id,event_date,event_time,title,details,color,created_at").gte("event_date",firstDay()).lt("event_date",nextMonthFirst()).order("event_date").order("event_time",{ascending:true,nullsFirst:true});if(ee){$("syncText").textContent="讀取行程失敗";return}events=e||[];const {data:n,error:ne}=await sb.from("sbd_month_notes").select("id,month_start,note").eq("month_start",firstDay()).maybeSingle();currentNoteRow=ne?null:n;render();$("syncText").textContent="資料已同步" }
function render(){const y=view.getFullYear(),m=view.getMonth()+1;$("monthTitle").textContent=`${y} 年 ${m} 月`;const last=new Date(y,m,0).getDate(),first=(new Date(y,m-1,1).getDay()+6)%7,h=holidayMap(y,m);let out="";for(let r=0;r<6;r++){out+='<div class="week">';for(let c=0;c<7;c++){const n=r*7+c-first+1;if(n<1||n>last){out+='<div class="day blank"></div>';continue}const key=`${ym()}-${pad(n)}`,a=events.filter(x=>x.event_date===key),b=a.filter(x=>x.color==="blue"),g=a.filter(x=>x.color==="green"),o=a.filter(x=>!["blue","green"].includes(x.color)),isRed=!!h[n]||c>=5;const chip=x=>{const t=(x.event_time?x.event_time.slice(0,5)+" ":"")+esc(x.title),cls=profile.role==="admin"?" adminEvent":"";return `<div class="event ${esc(x.color)}${cls}" data-id="${x.id}">${t}</div>`};out+=`<div class="day${isRed?" holiday":""}" data-date="${key}"><div class="date">${n}${h[n]?`<span class="holidayName">${esc(h[n])}</span>`:""}</div>${b.map(chip).join("")}<div class="split"></div>${g.map(chip).join("")}${o.map(chip).join("")}</div>`}out+='</div>'}$("weeks").innerHTML=out;if(profile.role==="admin"){$("weeks").querySelectorAll(".adminEvent").forEach(el=>el.addEventListener("click",ev=>{ev.stopPropagation();openEditEvent(el.dataset.id)}))}const note=(currentNoteRow?.note||"").trim();$("noteText").textContent=note;$("noteBox").classList.toggle("show",!!note)}
function openNewEvent(){if(!["admin","editor"].includes(profile.role))return;currentEditId=null;$("eventDlgTitle").textContent="新增行程";$("deleteEventBtn").classList.add("hidden");$("fdate").value=`${ym()}-01`;$("ftime").value="";$("ftitle").value="";$("fdetail").value="";$("fcolor").value="blue";$("eventDlg").showModal()}
function openViewEvent(id){
  const x=events.find(e=>String(e.id)===String(id));
  if(!x) return;
  $("vdate").textContent=(x.event_date||"").replaceAll("-","/");
  $("vtitle").textContent=x.title||"";
  $("vdetail").textContent=x.details||"";
  $("viewDlg").showModal();
}
function openEditEvent(id){if(profile.role!=="admin")return;const x=events.find(v=>v.id===id);if(!x)return;currentEditId=id;$("eventDlgTitle").textContent="修改行程";$("deleteEventBtn").classList.remove("hidden");$("fdate").value=x.event_date;$("ftime").value=x.event_time?x.event_time.slice(0,5):"";$("ftitle").value=x.title||"";$("fdetail").value=x.details||"";$("fcolor").value=x.color||"blue";$("eventDlg").showModal()}
async function saveEvent(){const payload={event_date:$("fdate").value,event_time:$("ftime").value||null,title:$("ftitle").value.trim(),details:$("fdetail").value.trim()||null,color:$("fcolor").value};if(!payload.event_date||!payload.title){alert("請輸入日期和名稱");return}let error;if(currentEditId&&profile.role==="admin")({error}=await sb.from("sbd_calendar_events").update(payload).eq("id",currentEditId));else{if(!["admin","editor"].includes(profile.role))return;({error}=await sb.from("sbd_calendar_events").insert(payload))}if(error){alert("儲存失敗："+error.message);return}$("eventDlg").close();await loadMonth()}
async function deleteEvent(){if(profile.role!=="admin"||!currentEditId)return;if(!confirm("確定刪除這筆行程？"))return;const {error}=await sb.from("sbd_calendar_events").delete().eq("id",currentEditId);if(error){alert("刪除失敗："+error.message);return}$("eventDlg").close();await loadMonth()}
function openNote(){if(profile.role!=="admin")return;$("fnote").value=currentNoteRow?.note||"";$("noteDlg").showModal()}
async function saveNote(){if(profile.role!=="admin")return;const note=$("fnote").value.trim();let error;if(currentNoteRow)({error}=await sb.from("sbd_month_notes").update({note}).eq("id",currentNoteRow.id));else({error}=await sb.from("sbd_month_notes").insert({month_start:firstDay(),note}));if(error){alert("備註儲存失敗："+error.message);return}$("noteDlg").close();await loadMonth()}
async function logout(){await sb.auth.signOut();profile=null;currentUser=null;$("appPage").classList.add("hidden");$("loginPage").classList.remove("hidden")}
$("loginBtn").addEventListener("click",signIn);$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});$("logoutBtn").addEventListener("click",logout);$("prevBtn").addEventListener("click",()=>{view.setMonth(view.getMonth()-1);loadMonth()});$("nextBtn").addEventListener("click",()=>{view.setMonth(view.getMonth()+1);loadMonth()});$("todayBtn").addEventListener("click",()=>{view=new Date();view.setDate(1);loadMonth()});$("addBtn").addEventListener("click",openNewEvent);$("noteBtn").addEventListener("click",openNote);
$("fdate").addEventListener("blur",()=>{
  const iso=normalizeDateInput($("fdate").value);
  if(iso) $("fdate").value=displayDateInput(iso);
});
$("ftime").addEventListener("blur",()=>{
  const t=normalizeTimeInput($("ftime").value);
  if(t) $("ftime").value=t;
});

$("closeViewBtn").addEventListener("click",()=>$("viewDlg").close());
$("saveEventBtn").addEventListener("click",saveEvent);$("deleteEventBtn").addEventListener("click",deleteEvent);$("saveNoteBtn").addEventListener("click",saveNote);boot();
</script>
</body>
</html>
