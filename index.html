<script>
const SUPABASE_URL="https://zyusqrmayrucesijpmls.supabase.co";
const SUPABASE_KEY="sb_publishable_9EDbdx3Xmm87kqpI8lyPIA_1QDwzZdk";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id); let view=new Date();view.setDate(1);let currentUser=null,profile=null,events=[],currentEditId=null,currentNoteRow=null;
const pad=n=>String(n).padStart(2,"0"),ym=()=>`${view.getFullYear()}-${pad(view.getMonth()+1)}`,firstDay=()=>`${ym()}-01`;
function nextMonthFirst(){const d=new Date(view.getFullYear(),view.getMonth()+1,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`}
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const INSTALL_RE=/^\[\[INSTALL:(勝寶鼎|外包)\]\]\n?/;
function eventInstall(x){
  const raw=String(x?.details||"");
  const m=raw.match(INSTALL_RE);
  if(m)return m[1];
  // 舊資料沒有「安裝」欄位時，僅用原本顏色做一次相容判斷；新資料不再依顏色決定上下位置。
  return x?.color==="green"?"外包":"勝寶鼎";
}
function cleanEventDetails(v){return String(v||"").replace(INSTALL_RE,"")}
function packEventDetails(v,install){const d=String(v||"").trim();return `[[INSTALL:${install||"勝寶鼎"}]]${d?"\n"+d:""}`}
function normalizeDateInput(v){let x=String(v||"").trim().replace(/[.\-]/g,"/");if(/^\d{8}$/.test(x))x=x.slice(0,4)+"/"+x.slice(4,6)+"/"+x.slice(6,8);const m=x.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return "";const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return "";return `${m[1]}-${pad(mo)}-${pad(d)}`}
function displayDateInput(v){return String(v||"").slice(0,10).replace(/-/g,"/")}
function normalizeTimeInput(v){const d=String(v||"").replace(/\D/g,"");if(d.length!==4)return "";const h=+d.slice(0,2),m=+d.slice(2);if(h>23||m>59)return "";return `${pad(h)}:${pad(m)}`}
function holidayMap(y,m){
  // 依行政院人事行政總處 2026（115年）及 2027（116年）辦公日曆表設定。
  // 週六、週日本來就由月曆自動顯示紅字；這裡只標示真正的國定假日／補假名稱，
  // 不再把週末寫成「連假」。
  const all={
    // 2026
    "2026-01-01":"元旦",
    "2026-02-15":"除夕前一日",
    "2026-02-16":"除夕",
    "2026-02-17":"春節",
    "2026-02-18":"春節",
    "2026-02-19":"春節",
    "2026-02-20":"春節補假",
    "2026-02-27":"和平紀念日補假",
    "2026-02-28":"和平紀念日",

    "2027-02-28":"和平紀念日",

function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function fromB64url(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
async function ensurePasskey(){
  try{
    if(!window.PublicKeyCredential||!navigator.credentials)return;
    const saved=localStorage.getItem("sbd_passkey_id");
    if(saved)return;
    if(!currentUser)return;
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    const userId=new TextEncoder().encode(currentUser.id);
    const cred=await navigator.credentials.create({publicKey:{challenge,rp:{name:"勝寶鼎新弘股公司"},user:{id:userId,name:currentUser.email||currentUser.id,displayName:currentUser.email||"勝寶鼎使用者"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",residentKey:"preferred",userVerification:"required"},timeout:60000,attestation:"none"}});
    if(cred)localStorage.setItem("sbd_passkey_id",b64url(cred.rawId));
  }catch(e){}
}
async function passkeyLogin(){
  $("loginErr").textContent="";
  try{
    const saved=localStorage.getItem("sbd_passkey_id");
    const {data:{session}}=await sb.auth.getSession();
    if(!saved){$("loginErr").textContent="請先用 Email＋密碼登入一次，才能啟用 Face ID／裝置解鎖";return}
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({publicKey:{challenge,allowCredentials:[{type:"public-key",id:fromB64url(saved)}],userVerification:"required",timeout:60000}});
    if(session){await boot();return}
    $("loginErr").textContent="裝置驗證成功，但登入工作階段已過期，請再用密碼登入一次";
  }catch(e){$("loginErr").textContent="Face ID／裝置解鎖未完成"}
}
async function signIn(){ $("loginErr").textContent="";const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||!password){$("loginErr").textContent="請輸入 Email 和密碼";return}$("loginBtn").disabled=true;const {error}=await sb.auth.signInWithPassword({email,password});$("loginBtn").disabled=false;if(error){$("loginErr").textContent="登入失敗，請確認帳號或密碼";return}await boot();await ensurePasskey() }
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){$("loginPage").classList.remove("hidden");$("appPage").classList.add("hidden");return}currentUser=session.user;const {data,error}=await sb.from("sbd_users").select("display_name,role,active").eq("user_id",currentUser.id).maybeSingle();if(error||!data||!data.active){await sb.auth.signOut();$("loginErr").textContent="此帳號尚未開通勝寶鼎/新弘股公司權限";$("loginPage").classList.remove("hidden");$("appPage").classList.add("hidden");return}profile=data;$("loginPage").classList.add("hidden");$("appPage").classList.remove("hidden");const roleText=profile.role==="admin"?"管理者":profile.role==="editor"?"可查看＋新增":"只能查看";$("roleLine").textContent=`${profile.display_name||currentUser.email}｜${roleText}`;$("noteBtn").classList.toggle("hidden",profile.role!=="admin");await loadMonth()}
async function loadMonth(){ $("syncText").textContent="讀取中…";const {data:e,error:ee}=await sb.from("sbd_calendar_events").select("id,event_date,event_time,title,details,color,created_at").gte("event_date",firstDay()).lt("event_date",nextMonthFirst()).order("event_date").order("event_time",{ascending:true,nullsFirst:true});if(ee){$("syncText").textContent="讀取行程失敗";return}events=e||[];const {data:n,error:ne}=await sb.from("sbd_month_notes").select("id,month_start,note").eq("month_start",firstDay()).maybeSingle();currentNoteRow=ne?null:n;render();$("syncText").textContent="資料已同步" }
function render(){const y=view.getFullYear(),m=view.getMonth()+1;$("monthTitle").textContent=`${y} 年 ${m} 月`;const last=new Date(y,m,0).getDate(),first=(new Date(y,m-1,1).getDay()+6)%7,h=holidayMap(y,m);let out="";for(let r=0;r<6;r++){out+='<div class="week">';for(let c=0;c<7;c++){const n=r*7+c-first+1;if(n<1||n>last){out+='<div class="day blank"></div>';continue}const key=`${ym()}-${pad(n)}`,a=events.filter(x=>x.event_date===key),upper=a.filter(x=>eventInstall(x)==="勝寶鼎"),lower=a.filter(x=>eventInstall(x)==="外包"),isRed=!!h[n]||c>=5;const chip=x=>{const t=(x.event_time?x.event_time.slice(0,5)+" ":"")+esc(x.title);return `<div class="event ${esc(x.color)} adminEvent" data-id="${x.id}">${t}</div>`};const canAdd=["admin","editor"].includes(profile.role);out+=`<div class="day${isRed?" holiday":""}" data-date="${key}"><div class="dateLine${canAdd?" canAdd":""}"${canAdd?` data-date="${key}" role="button" tabindex="0" aria-label="新增 ${key} 行程"`:""}><div class="date">${n}${h[n]?`<span class="holidayName">${esc(h[n])}</span>`:""}</div>${canAdd?`<span class="dayAdd">＋ 新增</span>`:""}</div>${upper.map(chip).join("")}<div class="split"></div>${lower.map(chip).join("")}</div>`}out+='</div>'}$("weeks").innerHTML=out;$("weeks").querySelectorAll(".adminEvent").forEach(el=>el.addEventListener("click",ev=>{ev.stopPropagation();if(profile.role==="admin")openEditEvent(el.dataset.id);else openViewEvent(el.dataset.id)}));$("weeks").querySelectorAll(".dateLine.canAdd").forEach(el=>{el.addEventListener("click",ev=>{ev.stopPropagation();openNewEvent(el.dataset.date)});el.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();openNewEvent(el.dataset.date)}})});const note=(currentNoteRow?.note||"").trim();$("noteText").textContent=note;$("noteBox").classList.toggle("show",!!note)}
function openNewEvent(dateOverride){if(!["admin","editor"].includes(profile.role))return;currentEditId=null;$("eventDlgTitle").textContent="新增行程";$("deleteEventBtn").classList.add("hidden");$("installField").classList.toggle("hidden",!["admin","editor"].includes(profile.role));$("fdate").value=displayDateInput(dateOverride||`${ym()}-01`);$("ftime").value="";$("ftitle").value="";$("fdetail").value="";$("fcolor").value="blue";$("finstall").value="勝寶鼎";$("eventDlg").showModal()}
function openViewEvent(id){
  const x=events.find(e=>String(e.id)===String(id));
  if(!x) return;
  $("vdate").textContent=(x.event_date||"").replaceAll("-","/");
  $("vtitle").textContent=x.title||"";
  $("vdetail").textContent=cleanEventDetails(x.details);
  $("viewDlg").showModal();
}
function openEditEvent(id){if(profile.role!=="admin")return;const x=events.find(v=>v.id===id);if(!x)return;currentEditId=id;$("eventDlgTitle").textContent="修改行程";$("deleteEventBtn").classList.remove("hidden");$("installField").classList.remove("hidden");$("fdate").value=displayDateInput(x.event_date);$("ftime").value=x.event_time?x.event_time.slice(0,5):"";$("ftitle").value=x.title||"";$("fdetail").value=cleanEventDetails(x.details);$("fcolor").value=x.color||"blue";$("finstall").value=eventInstall(x);$("eventDlg").showModal()}
async function saveEvent(){const event_date=normalizeDateInput($("fdate").value)||$("fdate").value;const event_time=$("ftime").value?(normalizeTimeInput($("ftime").value)||$("ftime").value):null;const install=$("finstall").value||"勝寶鼎";const payload={event_date,event_time,title:$("ftitle").value.trim(),details:packEventDetails($("fdetail").value,install),color:$("fcolor").value};if(!payload.event_date||!payload.title){alert("請輸入日期和名稱");return}let error;if(currentEditId&&profile.role==="admin")({error}=await sb.from("sbd_calendar_events").update(payload).eq("id",currentEditId));else{if(!["admin","editor"].includes(profile.role))return;({error}=await sb.from("sbd_calendar_events").insert(payload))}if(error){alert("儲存失敗："+error.message);return}$("eventDlg").close();await loadMonth()}
async function deleteEvent(){if(profile.role!=="admin"||!currentEditId)return;if(!confirm("確定刪除這筆行程？"))return;const {error}=await sb.from("sbd_calendar_events").delete().eq("id",currentEditId);if(error){alert("刪除失敗："+error.message);return}$("eventDlg").close();await loadMonth()}
function openNote(){if(profile.role!=="admin")return;$("fnote").value=currentNoteRow?.note||"";$("noteDlg").showModal()}
async function saveNote(){if(profile.role!=="admin")return;const note=$("fnote").value.trim();let error;if(currentNoteRow)({error}=await sb.from("sbd_month_notes").update({note}).eq("id",currentNoteRow.id));else({error}=await sb.from("sbd_month_notes").insert({month_start:firstDay(),note}));if(error){alert("備註儲存失敗："+error.message);return}$("noteDlg").close();await loadMonth()}
async function logout(){await sb.auth.signOut();profile=null;currentUser=null;$("appPage").classList.add("hidden");$("loginPage").classList.remove("hidden")}
$("loginBtn").addEventListener("click",signIn);$("passkeyBtn").addEventListener("click",passkeyLogin);
["loginEmail","loginPassword"].forEach(id=>{
  $(id).addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      signIn();
    }
  });
});$("logoutBtn").addEventListener("click",logout);$("prevBtn").addEventListener("click",()=>{view.setMonth(view.getMonth()-1);loadMonth()});$("nextBtn").addEventListener("click",()=>{view.setMonth(view.getMonth()+1);loadMonth()});$("todayBtn").addEventListener("click",()=>{view=new Date();view.setDate(1);loadMonth()});$("noteBtn").addEventListener("click",openNote);
$("fdate").addEventListener("blur",()=>{
  const iso=normalizeDateInput($("fdate").value);
  if(iso) $("fdate").value=displayDateInput(iso);
});
$("ftime").addEventListener("blur",()=>{
  const t=normalizeTimeInput($("ftime").value);
  if(t) $("ftime").value=t;
});

$("closeViewBtn").addEventListener("click",()=>$("viewDlg").close());
$("saveEventBtn").addEventListener("click",saveEvent);$("deleteEventBtn").addEventListener("click",deleteEvent);$("saveNoteBtn").addEventListener("click",saveNote);boot();
</script>

<script>
(function(){
  const indicator=document.getElementById('pullRefreshIndicator');
  if(!indicator || !('ontouchstart' in window)) return;
  let startY=0, pulling=false, refreshing=false;
  const threshold=78, maxPull=110;
  document.addEventListener('touchstart',function(e){
    if(refreshing) return;
    if(window.scrollY<=0 && e.touches && e.touches.length===1){startY=e.touches[0].clientY;pulling=true;}
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling || refreshing || !e.touches || !e.touches.length) return;
    if(window.scrollY>0){pulling=false;indicator.classList.remove('show');return;}
    const distance=Math.max(0,Math.min(maxPull,e.touches[0].clientY-startY));
    if(distance>8){indicator.classList.add('show');const spinner=indicator.querySelector('.pull-spinner');if(spinner) spinner.style.transform='rotate('+(distance/maxPull*270)+'deg)';}
  },{passive:true});
  document.addEventListener('touchend',function(){
    if(!pulling || refreshing) return;pulling=false;
    const spinner=indicator.querySelector('.pull-spinner');
    const angle=spinner&&spinner.style.transform?parseFloat(spinner.style.transform.replace(/[^0-9.-]/g,'')):0;
    if(angle>=190){refreshing=true;indicator.classList.add('show','refreshing');if(spinner)spinner.style.transform='';setTimeout(function(){location.reload();},350);}
    else{indicator.classList.remove('show');if(spinner)spinner.style.transform='';}
  },{passive:true});
  document.addEventListener('touchcancel',function(){pulling=false;indicator.classList.remove('show');},{passive:true});
})();
</script>
